id = "herdr-brrr"
name = "Money Printer Brrr"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "While an agent works, a strip under its pane plays your GIF next to a running tally of money spent on AI"
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "hook.mjs"]

[[events]]
on = "pane.closed"
command = ["node", "hook.mjs"]

[[actions]]
id = "toggle"
title = "Toggle the brrr strip on/off"
command = ["node", "toggle.mjs"]

[[panes]]
id = "set-gif"
title = "brrr GIF bank"
placement = "popup"
width = "70%"
height = 20
command = ["node", "set-gif.mjs"]
